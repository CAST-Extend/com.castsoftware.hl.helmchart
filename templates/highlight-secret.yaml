# Create the default secret ONLY if no external secret is provided in the values (existingSecret).
# Key names are the contract an existingSecret must follow - see existingSecret in values.yaml.
{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: highlight-pwd-sec
  namespace: {{ .Release.Namespace }}
type: Opaque
data:
  postgres-superuser-password: {{ .Values.Postgres.superuser.password | default "" | toString | b64enc }}
  postgres-highlight-user-password: {{ .Values.Postgres.highlightUser.password | default "" | toString | b64enc }}
  postgres-highlight-root-password: {{ .Values.Postgres.highlightRootUser.password | default "" | toString | b64enc }}
  cvedb-smtp-password: {{ .Values.Cvedb.smtp.password | default "" | toString | b64enc }}
  cvedb-nist-api-key: {{ .Values.Cvedb.nistApiKey | default "" | toString | b64enc }}
  portal-smtp-password: {{ .Values.HighlightPortal.smtp.password | default "" | toString | b64enc }}
  portal-admin-password: {{ .Values.HighlightPortal.admin.password | default "" | toString | b64enc }}
  portal-sca-sam-secret: {{ .Values.HighlightPortal.scaSamSecret | default "" | toString | b64enc }}
  {{- range $k := list "key0" "key5" "key6" "key7" "key8" "key9" "key10" "key11" }}
  portal-license-{{ $k }}: {{ get ($.Values.HighlightPortal.license | default dict) $k | default "" | toString | b64enc }}
  {{- end }}
  {{- if .Values.Keycloak.enabled }}
  keycloak-db-password: {{ .Values.Keycloak.database.password | default "" | toString | b64enc }}
  keycloak-bootstrap-admin-password: {{ .Values.Keycloak.bootstrapAdmin.password | default "" | toString | b64enc }}
  keycloak-permanent-admin-password: {{ .Values.Keycloak.permanentAdmin.password | default "" | toString | b64enc }}
  keycloak-admin-client-secret: {{ .Values.Keycloak.adminClientSecret | default "" | toString | b64enc }}
  keycloak-portal-client-secret: {{ .Values.Keycloak.portalClientSecret | default "" | toString | b64enc }}
  keycloak-webhook-secret: {{ .Values.Keycloak.webhookSecret | default "" | toString | b64enc }}
  keycloak-smtp-password: {{ .Values.Keycloak.smtp.password | default "" | toString | b64enc }}
  {{- end }}
{{- end }}
