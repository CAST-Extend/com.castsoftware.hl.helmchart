{{- if eq .Values.networking.type "ingress" }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: highlight-gateway
  namespace: {{ .Release.Namespace }}
  # ingress-nginx defaults to a 1m request body limit, which rejects HighlightAutomation result
  # uploads (and source archives) with "413 Request Entity Too Large". These defaults mirror the
  # compose gateway (client_max_body_size / proxy_*_timeout); any key set in
  # networking.ingress.annotations overrides them.
  {{- $defaults := dict
        "nginx.ingress.kubernetes.io/proxy-body-size" (toString .Values.networking.ingress.proxyBodySize)
        "nginx.ingress.kubernetes.io/proxy-connect-timeout" "300"
        "nginx.ingress.kubernetes.io/proxy-send-timeout" "300"
        "nginx.ingress.kubernetes.io/proxy-read-timeout" "300" }}
  annotations:
    {{- toYaml (merge (deepCopy (.Values.networking.ingress.annotations | default dict)) $defaults) | nindent 4 }}
spec:
  ingressClassName: {{ .Values.networking.ingress.className }}
{{- if .Values.networking.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.gateway.host }}
      secretName: {{ .Values.networking.ingress.tls.secretName }}
{{- end }}
  rules:
    - host: {{ .Values.gateway.host }}
      http:
        paths:
{{- if .Values.Keycloak.enabled }}
          # Keycloak's browser-facing login/realm endpoints, published under the same host/gateway
          # so only one external entry point exists - matches KC_HTTP_RELATIVE_PATH=/auth in
          # templates/keycloak-configmap.yaml.
          - path: /auth
            pathType: Prefix
            backend:
              service:
                name: keycloak
                port:
                  number: {{ .Values.KeycloakImage.appPort }}
{{- end }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: highlightportal
                port:
                  number: 8080
{{- end }}
