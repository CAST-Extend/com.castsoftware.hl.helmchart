apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tmp-highlight
  namespace: {{ .Release.Namespace }}
  labels:
    highlight.service: tmp-highlight
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes:
    - ReadWriteOnce
{{- if .Values.storageClass.name }}
  storageClassName: {{ .Values.storageClass.name }}
{{- end }}
  resources:
    requests:
      storage: {{ .Values.storageClass.portalTmpSize }}
