# Sensitive values for the k8s-cloud chart - passwords, client secrets, and license keys.
#
# This file ships with CHANGEME placeholders only, same as k8s-onprem's values_*.yaml. Before a
# real deployment:
#   1. Copy it (e.g. to values-secret.local.yaml) and fill in real values there instead of editing
#      this tracked template in place, so real secrets never end up committed to git.
#   2. For production, prefer your cloud provider's secret manager (AKS Key Vault CSI driver, EKS
#      External Secrets/Secrets Manager, GKE Secret Manager CSI driver) or Sealed Secrets/SOPS over
#      a plain values file at all - inject via --set or a values file kept out of version control.
#      Or skip this file entirely: set existingSecret (see values.yaml) to the name of a Kubernetes
#      Secret managed outside the chart (e.g. synced by External Secrets Operator) - every value
#      below is then ignored.
#
# The chart renders these values into the "highlight-pwd-sec" Secret (templates/highlight-secret.yaml),
# never into ConfigMaps.
#
# Install with both files together, e.g.:
#   helm install highlight . -f values.yaml -f values-secret.yaml --namespace highlight --create-namespace

Keycloak:
  # Dedicated Keycloak admin API client secret (realm/IdP administration)
  adminClientSecret: "CHANGEME-admin-client-secret"
  # OIDC client secret used by the portal for end-user authentication
  portalClientSecret: "CHANGEME-portal-client-secret"
  # Shared secret securing the Keycloak -> Highlight event webhook
  webhookSecret: "CHANGEME-webhook-secret"
  bootstrapAdmin:
    password: 'CHANGEME-bootstrap-password'
  permanentAdmin:
    password: 'CHANGEME-permanent-admin-password'
  smtp:
    password: 'CHANGEME-smtp-password'
  database:
    password: 'CHANGEME-keycloak-db-password'

Postgres:
  superuser:
    password: 'CHANGEME-postgres-superuser-password'
  highlightUser:
    password: 'CHANGEME-highlight-user-password'
  highlightRootUser:
    password: 'CHANGEME-highlight-root-password'

Cvedb:
  # Passed to cvedb as env vars (not written into cvedb.properties), so no "\" escaping is needed -
  # only avoid the sequence "${", which Spring would resolve as a placeholder.
  smtp:
    password: 'CHANGEME-cvedb-smtp-password'
  nistApiKey: "CHANGEME-nist-api-key"

HighlightPortal:
  smtp:
    password: 'CHANGEME-portal-smtp-password'
  admin:
    # Must satisfy the Keycloak realm's password policy (digits(1), length(14), upperCase(1),
    # lowerCase(1), specialChars(1)) - seeded as the admin's initial Keycloak credential.
    password: 'CHANGEME-Admin123!'
  scaSamSecret: "CHANGEME-sca-sam-secret"
  license:
    key0: "CHANGEME"
    key5: "CHANGEME"
    key6: "CHANGEME"
    key10: "CHANGEME"
    key11: "CHANGEME"
    key7: "CHANGEME"
    key9: "CHANGEME"
    key8: "CHANGEME"
